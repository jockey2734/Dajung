services:
  caddy:
    ports: !override
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    command: pnpm dev --hostname 0.0.0.0
    environment:
      NODE_ENV: development
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next

  api:
    command: uvicorn api.app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./api:/app/api
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      - ./prompts:/app/prompts

volumes:
  web_node_modules:
  web_next:
