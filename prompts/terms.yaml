# 헤더·문서 설명 용어 사전 — api/app/ingest/terms.py가 읽는다.
# Contextual Retrieval 헤더와 문서 설명(모델 출력)에만 적용한다. 원문·검색 본문은 바꾸지 않는다.
# 고친 뒤 형식 확인: uv run pytest api/tests/ingest/test_terms.py

# 표준어: [별칭, ...] — 모델 출력의 별칭을 항상 표준어로 바꾼다.
unify:
  동아리방: [동아리실, 동방]

# 조건부 교체 — 원문에 wrong이 없고, when_source_has 중 하나가 원문에 있을 때만 바꾼다.
# 사무실: 모델이 지어내는 말. 원문이 공간을 말할 때만 동아리방으로 고친다
# (단체·활동을 말하는 '동아리'까지 동아리방으로 바꾸면 과적용).
conditional:
  - wrong: 사무실
    right: 동아리방
    when_source_has: [동아리방, 동아리실, 동방]

# 절대 건드리지 않는 단어 — 별칭이 안에 들어 있어도 그대로 둔다.
protect: [동방미인]

# 원문에 있으면 "원문 표기 그대로 쓸 용어"로 프롬프트에 넣는 동아리 용어.
# 영문 약어(ISS, OT 등)는 코드가 자동으로 찾으므로 여기 적지 않는다.
keep:
  - 집행부
  - 운영지원부
  - 기획부
  - 홍보부
  - 총무부
  - 회장단
  - 동비
  - 동양차
  - 서양차
  - 홈커밍데이
  - 연합다회
  - 홍보부스
  - 정규활동
  - 다회
